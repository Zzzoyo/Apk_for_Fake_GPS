name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 关键步骤：使用官方 Action 强制安装 Gradle 7.5
      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5

      - name: Build MockGpsShizuku
        working-directory: ./MockGpsShizuku
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build AmiMockGps
        working-directory: ./AmiMockGps
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-apks
          path: |
            MockGpsShizuku/app/build/outputs/apk/debug/*.apk
            AmiMockGps/app/build/outputs/apk/debug/*.apk
