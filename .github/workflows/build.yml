name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5
          cache-disabled: true

      # اكتب ملف التكوين الإضافي لتجنب خطأ sdk.dir
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > MockGpsShizuku/local.properties
          echo "sdk.dir=$ANDROID_HOME" > AmiMockGps/local.properties

      - name: Build MockGpsShizuku
        working-directory: ./MockGpsShizuku
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build AmiMockGps
        working-directory: ./AmiMockGps
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-apks
          path: |
            MockGpsShizuku/app/build/outputs/apk/debug/*.apk
            AmiMockGps/app/build/outputs/apk/debug/*.apk
