name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MockGpsShizuku
        working-directory: ./MockGpsShizuku
        run: |
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build AmiMockGps
        working-directory: ./AmiMockGps
        run: |
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-apks
          path: |
            MockGpsShizuku/app/build/outputs/apk/debug/*.apk
            AmiMockGps/app/build/outputs/apk/debug/*.apk
