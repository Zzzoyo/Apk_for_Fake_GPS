name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MockGpsShizuku
        run: |
          cd MockGpsShizuku
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build AmiMockGps
        run: |
          cd AmiMockGps
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-apks
          path: |
            MockGpsShizuku/app/build/outputs/apk/debug/*.apk
            AmiMockGps/app/build/outputs/apk/debug/*.apk
